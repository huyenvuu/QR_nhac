<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Nhỏ Vui Vẻ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h3 {
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 20px;
            line-height: 1.4;
        }
        .image-container {
            margin: 20px 0;
        }
        .image-container img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        .btn:hover {
            background-color: #ff5252;
            transform: scale(1.05);
        }
        #player-container {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 id="message">Hope you stay happy and refreshed for the rest of your workday! 🥤✨</h3>
        <p>Here’s a random song just for you! 🎵</p>

        <!-- Open song random button-->
        <button class="btn" onclick="playRandomSong()">🎧</button>

        <div id="player-container">
            <!-- Khung nhúng YouTube -->
            <iframe id="youtube-iframe" width="100%" height="166" src="" frameborder="0" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        // link YouTube song
        const playlist = [
            "https://youtu.be/BgmY2MkrY0I?si=X5XkIyNX2iMltONJ", // you are the reason
            "https://youtu.be/gm3znyA0XLg?si=jL6QWUR9oF1_YIRN", // me and you
            "https://youtu.be/uQiF1yOnzDg?si=TrXCiQLKLm86--Zr", // double take
            "https://youtu.be/I3IcQsfC7jA?si=oKJdwENajYLY0TtO", // night changes
            "https://youtu.be/cNGjD0VG4R8?si=sUDilPr19RBCurv0", // perfect
            "https://youtu.be/8A7-54UguKg?si=SeNoEYUwhUML-BKm", // say you wont let go
            "https://youtu.be/FGGo8LFmbjs?si=EHkMxAtmB1Jcvzf_", // someone you loved
            "https://youtu.be/Cm9pISXjeiI?si=Hq69OS07dcLWURCp", // you are my everything
            "https://youtu.be/KKQl-pIRQMY?si=AtVQAUawj09tvoDC", // photograph
            "https://youtu.be/o_1aF54DO60?si=V1eOTtNebqRoJNWG", // young and beautiful
            "https://youtu.be/AyEwKVPeXzQ?si=L6YjhLG9i37yefqZ", // i wish you coud stay
            "https://youtu.be/-uFQzcY7YHc?si=xxT3qqF8Qtj_6p7t"  // head in the clouds

        ];

        function playRandomSong() {
            // Random 1 song
            const randomIndex = Math.floor(Math.random() * playlist.length);
            const selectedSong = playlist[randomIndex];

            // Show khung nhac
            const playerContainer = document.getElementById('player-container');
            const iframe = document.getElementById('youtube-iframe');
            
            playerContainer.style.display = 'block';
            iframe.src = selectedSong;
        }
    </script>

</body>
</html>
